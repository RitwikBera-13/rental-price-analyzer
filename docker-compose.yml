networks:
  bigdata-net:
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode:

services:
  # ----------------------------------------------------------------------------
  # Hadoop HDFS - NameNode (Manages filesystem namespace & metadata)
  # ----------------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: rental-hadoop-namenode
    restart: always
    ports:
      - "9870:9870"   # NameNode Web UI & WebHDFS REST API
      - "9000:9000"   # HDFS RPC / IPC port
    environment:
      - CLUSTER_NAME=rental-analyzer-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_permissions=false
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - bigdata-net

  # ----------------------------------------------------------------------------
  # Hadoop HDFS - DataNode (Stores actual data blocks & replicates)
  # ----------------------------------------------------------------------------
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: rental-hadoop-datanode
    restart: always
    ports:
      - "9864:9864"   # DataNode Web UI & HTTP block data transfer
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_permissions=false
      - HDFS_CONF_dfs_webhdfs_enabled=true
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - bigdata-net

  # ----------------------------------------------------------------------------
  # Apache Spark - Master Node (Official Apache Spark 3.5.1 Image)
  # ----------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.1
    container_name: rental-spark-master
    restart: always
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master cluster connection port
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./models:/opt/spark/models:ro
    networks:
      - bigdata-net

  # ----------------------------------------------------------------------------
  # Apache Spark - Worker Node (Official Apache Spark 3.5.1 Image)
  # ----------------------------------------------------------------------------
  spark-worker:
    image: apache/spark:3.5.1
    container_name: rental-spark-worker
    restart: always
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --webui-port 8081
      spark://spark-master:7077
    ports:
      - "8081:8081"   # Spark Worker Web UI
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./models:/opt/spark/models:ro
    networks:
      - bigdata-net

  # ----------------------------------------------------------------------------
  # One-Time Initialization Service (Pre-creates HDFS directories on NameNode)
  # ----------------------------------------------------------------------------
  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: rental-hdfs-init
    depends_on:
      - namenode
      - datanode
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        echo "Waiting for HDFS NameNode RPC at hdfs://namenode:9000..." &&
        until hdfs dfs -D fs.defaultFS=hdfs://namenode:9000 -ls / > /dev/null 2>&1; do
          sleep 2
        done &&
        echo "NameNode is online! Creating HDFS directories..." &&
        hdfs dfs -D fs.defaultFS=hdfs://namenode:9000 -mkdir -p /rental_data/raw /rental_data/analytics /rental_data/predictions &&
        hdfs dfs -D fs.defaultFS=hdfs://namenode:9000 -chmod -R 777 /rental_data &&
        echo "HDFS Directories Initialized Successfully:" &&
        hdfs dfs -D fs.defaultFS=hdfs://namenode:9000 -ls -R /rental_data
    networks:
      - bigdata-net
